# Day3_14 ACT Training Config (all stages combined: hanger + move + move_hanger)
# 用法: cd /workspace/Zeno-wholebody && /venv/main/bin/python3 train/run_train.py --config train/config/day3_14_act.yaml

runtime:
  command: "/venv/main/bin/lerobot-train"
  check_command: true
  cwd: "."
  dry_run: false
  env:
    CUDA_VISIBLE_DEVICES: "1"
    WANDB_NAME: "day3_14_act"

variables:
  dataset_root: "/workspace/Zeno-wholebody/data"
  output_root: "/workspace/Zeno-wholebody/model"
  run_name: "day3_14_act"

train_args:
  dataset:
    repo_id: "day3_14"
    root: "{dataset_root}/day3_14"
    video_backend: "torchcodec"

  policy:
    type: "act"
    device: "cuda"
    repo_id: "local/{run_name}"
    push_to_hub: false
    use_amp: true
    n_obs_steps: 1
    chunk_size: 100
    n_action_steps: 1
    vision_backbone: "resnet34"
    pretrained_backbone_weights: "ResNet34_Weights.IMAGENET1K_V1"
    dim_model: 512
    dim_feedforward: 3200
    n_encoder_layers: 4
    n_decoder_layers: 1

  steps: 200000
  batch_size: 64
  num_workers: 8
  save_freq: 10000
  log_freq: 200

  wandb:
    enable: true
    mode: "online"
    project: "zeno-wholebody"
    entity: "zeno-rp"

  output_dir: "{output_root}/{run_name}"
  job_name: "day3_14_act"

flags: []
raw_args: []
