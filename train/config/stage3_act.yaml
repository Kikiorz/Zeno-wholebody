# Stage3 ACT Training Config
# 用法: cd /workspace/Zeno-wholebody && python train/run_train.py --config train/config/stage3_act.yaml

runtime:
  command: "/venv/main/bin/lerobot-train"
  check_command: true
  cwd: "."
  dry_run: false
  env:
    CUDA_VISIBLE_DEVICES: "0"
    WANDB_NAME: "stage3_act"

variables:
  dataset_root: "/workspace/Zeno-wholebody/data/Exp_stageAB"
  output_root: "/workspace/Zeno-wholebody/model"
  run_name: "stage3_act"

train_args:
  dataset:
    repo_id: "stage3_lerobot"
    root: "{dataset_root}/stage3_lerobot"
    video_backend: "torchcodec"

  policy:
    type: "act"
    device: "cuda"
    repo_id: "local/{run_name}"
    push_to_hub: false
    use_amp: true
    n_obs_steps: 1
    chunk_size: 100
    n_action_steps: 1
    vision_backbone: "resnet34"
    pretrained_backbone_weights: "ResNet34_Weights.IMAGENET1K_V1"
    dim_model: 512
    dim_feedforward: 3200
    n_encoder_layers: 4
    n_decoder_layers: 1

  steps: 200000
  batch_size: 64
  num_workers: 8
  save_freq: 10000
  log_freq: 200

  wandb:
    enable: true
    mode: "online"
    project: "zeno-wholebody"
    entity: "zeno-rp"

  output_dir: "{output_root}/{run_name}"
  job_name: "stage3_act"

flags: []
raw_args: []
